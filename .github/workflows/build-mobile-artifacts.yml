name: Build signed mobile artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release-keystore.jks
          EOF
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build iOS Ad Hoc IPA
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Import Apple distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "Missing Apple distribution certificate secrets"; exit 1; }
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "${{ github.run_id }}" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "${{ github.run_id }}" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ github.run_id }}" "$RUNNER_TEMP/build.keychain"
      - name: Install Ad Hoc provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64" || { echo "Missing IOS_ADHOC_PROVISIONING_PROFILE_BASE64"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/adhoc.mobileprovision"
      - run: flutter pub get --enforce-lockfile
      - name: Create IPA export options
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$TEAM_ID" || { echo "Missing IOS_TEAM_ID"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.chsmessenger.app</key><string>CHS Ad Hoc</string></dict>
          </dict></plist>
          EOF
      - run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-adhoc-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
